app = 'utos-staging-frontend'
primary_region = 'sin'

[build]
  dockerfile = 'docker/frontend.Dockerfile'

[build.args]
  NEXT_PUBLIC_API_URL = 'https://utos-staging-backend.fly.dev'

[env]
  NODE_ENV = 'production'
  NEXT_PUBLIC_API_URL = 'https://utos-staging-backend.fly.dev'

[[services]]
  internal_port = 3000
  protocol = 'tcp'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '15s'
    method = 'get'
    path = '/dashboard'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
