# fly.toml app configuration file generated for utos-staging-backend on 2026-07-17T19:55:15+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'utos-staging-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.backend'

[env]
  APP_ENV = 'staging'
  BACKUP_DIR = '/tmp/backups'
  CORS_ORIGINS = 'https://utos-staging-frontend.fly.dev,http://localhost:3000'
  DEBUG = 'false'
  LOG_FORMAT = 'json'
  OTEL_ENABLED = 'false'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/live'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
