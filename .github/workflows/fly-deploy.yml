name: Fly.io Deploy

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

env:
  FLY_BACKEND_APP: utos-staging-backend
  FLY_FRONTEND_APP: utos-staging-frontend

jobs:
  # ── Build & push images to GHCR ─────────────
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Determine app names and API URL
        id: app
        run: |
          ENV="${{ inputs.environment || 'staging' }}"
          if [ "$ENV" = "production" ]; then
            echo "backend=utos-backend" >> $GITHUB_OUTPUT
            echo "frontend=utos-frontend" >> $GITHUB_OUTPUT
            echo "api_url=https://utos-backend.fly.dev" >> $GITHUB_OUTPUT
          else
            echo "backend=utos-staging-backend" >> $GITHUB_OUTPUT
            echo "frontend=utos-staging-frontend" >> $GITHUB_OUTPUT
            echo "api_url=https://utos-staging-backend.fly.dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: matrix.target == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/utos-backend:${{ inputs.environment || 'staging' }}
            ghcr.io/${{ github.repository_owner }}/utos-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: matrix.target == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.app.outputs.api_url }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/utos-frontend:staging
            ghcr.io/${{ github.repository_owner }}/utos-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Fly.io from GHCR ───────────────
  deploy-backend:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Determine app name
        id: app
        run: |
          ENV="${{ inputs.environment || 'staging' }}"
          if [ "$ENV" = "production" ]; then
            echo "backend=utos-backend" >> $GITHUB_OUTPUT
          else
            echo "backend=utos-staging-backend" >> $GITHUB_OUTPUT
          fi

      - name: Deploy backend from GHCR
        run: |
          flyctl deploy \
            --app ${{ steps.app.outputs.backend }} \
            --image ghcr.io/${{ github.repository_owner }}/utos-backend:staging \
            --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Fly.io
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Determine app name
        id: app
        run: |
          ENV="${{ inputs.environment || 'staging' }}"
          if [ "$ENV" = "production" ]; then
            echo "frontend=utos-frontend" >> $GITHUB_OUTPUT
          else
            echo "frontend=utos-staging-frontend" >> $GITHUB_OUTPUT
          fi

      - name: Deploy frontend from GHCR
        run: |
          flyctl deploy \
            --app ${{ steps.app.outputs.frontend }} \
            --image ghcr.io/${{ github.repository_owner }}/utos-frontend:staging \
            --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
